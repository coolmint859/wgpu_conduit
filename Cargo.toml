[package]
name = "wgpu_conduit"
version = "0.1.1"
edition = "2024"
description = "A mostly unopinionated wrapper over wgpu for real-time applications driven by the main thread."
license = "MIT"
repository = "https://github.com/coolmint859/wgpu_conduit"
readme = "README.md"
keywords = ["wgpu", "webgpu", "rendering", "graphics", "gpu"]
categories = ["rendering", "game-development", "graphics"]


[dependencies]
winit = "0.30"
wgpu = "28.0"
tokio = { version = "1", features = ["full"] }
bytemuck = { version = "1.24", features = [ "derive" ] }
image = "0.23"
uuid = { version = "1.27.0", features = ["v4"]}
async-store = "0.5.0"
pollster = "1.0.1"

[dev-dependencies]
glam = { version = "0.32.1", features = [ "bytemuck" ]}
env_logger = "0.10"
indexmap = "2.14.2"