[package]
name = "wgpu_conduit"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = "28.0"
tokio = { version = "1", features = ["full"] }
bytemuck = { version = "1.24", features = [ "derive" ] }
image = "0.23"
uuid = { version = "1.27.0", features = ["v4"]}
async-store = "0.4.0"
pollster = "1.0.1"

[dev-dependencies]
glam = { version = "0.32.1", features = [ "bytemuck" ]}
env_logger = "0.10"
indexmap = "2.14.2"